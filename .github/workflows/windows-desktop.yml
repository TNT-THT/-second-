name: Windows desktop test and portable ZIP
on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build standalone Windows folder and lightweight starter
        run: ./scripts/windows-portable.ps1
      - name: Check the real transparent window, isolated IPC and model switching
        run: npm run smoke:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: PetDesk-Windows-x64
          path: |
            out/*-Windows-x64.zip
            out/*-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  attach:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PetDesk-Windows-x64
          path: portable
      - name: Attach only to an existing release for this exact tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: petdesk-v1.0.0
        run: |
          set -eu
          if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha' 2>/dev/null); then
            echo 'No matching release tag; the ZIP is available as a workflow artifact.'; exit 0
          fi
          if [ "$sha" != "$GITHUB_SHA" ]; then echo 'Different revision; not modifying the release.'; exit 0; fi
          gh release upload "$TAG" portable/*.zip portable/*.sha256 --repo "$GITHUB_REPOSITORY"
